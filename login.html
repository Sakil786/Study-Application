<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Study Log - Sign In</title>
<style>
  :root {
    --paper: #EFEAE0;
    --card: #FBF9F4;
    --card-border: #DED6C4;
    --ink: #22314F;
    --ink-soft: #5A6786;
    --forest: #3F6C51;
    --forest-dark: #2F5540;
    --danger: #A24C63;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }

  .auth-container {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    padding: 32px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 10px 28px rgba(34,49,79,0.1);
  }

  h1 {
    font-family: 'Lora', serif;
    font-size: 28px;
    margin: 0 0 8px;
    text-align: center;
  }

  .subtitle {
    color: var(--ink-soft);
    font-size: 14px;
    text-align: center;
    margin: 0 0 24px;
  }

  .form-group {
    margin-bottom: 16px;
  }

  label {
    display: block;
    font-size: 13px;
    color: var(--ink-soft);
    font-weight: 600;
    margin-bottom: 5px;
  }

  input[type="text"], input[type="email"], input[type="password"] {
    width: 100%;
    font-family: inherit;
    font-size: 14px;
    color: var(--ink);
    background: #fff;
    border: 1px solid var(--card-border);
    border-radius: 7px;
    padding: 12px;
    transition: border-color 0.2s;
  }

  input:focus {
    outline: none;
    border-color: var(--forest);
  }

  .btn {
    width: 100%;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    background: var(--forest);
    color: #fff;
    border: none;
    border-radius: 7px;
    padding: 12px;
    cursor: pointer;
    transition: background-color 0.2s;
    margin-top: 8px;
  }

  .btn:hover {
    background: var(--forest-dark);
  }

  .btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  .switch-mode {
    text-align: center;
    margin-top: 20px;
    padding-top: 20px;
    border-top: 1px solid var(--card-border);
  }

  .switch-mode p {
    font-size: 14px;
    color: var(--ink-soft);
    margin: 0 0 8px;
  }

  .switch-btn {
    background: none;
    border: none;
    color: var(--forest);
    cursor: pointer;
    font-weight: 600;
    text-decoration: underline;
  }

  .error {
    background: #fdf1f1;
    color: var(--danger);
    border: 1px solid #f5c6cb;
    border-radius: 7px;
    padding: 12px;
    font-size: 13px;
    margin-bottom: 16px;
  }

  .success {
    background: #f1f9f4;
    color: var(--forest-dark);
    border: 1px solid #c3e6cb;
    border-radius: 7px;
    padding: 12px;
    font-size: 13px;
    margin-bottom: 16px;
  }
</style>
</head>
<body>

<div class="auth-container">
  <h1 id="authTitle">Welcome to Study Log</h1>
  <p class="subtitle" id="authSubtitle">Create an account to start tracking your study sessions</p>
  
  <div id="message" style="display: none;"></div>
  
  <form id="authForm">
    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" required maxlength="30">
    </div>
    
    <div class="form-group" id="emailGroup">
      <label for="email">Email (optional)</label>
      <input type="email" id="email" name="email">
    </div>
    
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required minlength="6">
    </div>
    
    <button type="submit" class="btn" id="submitBtn">Sign Up</button>
  </form>
  
  <div class="switch-mode">
    <p id="switchText">Already have an account?</p>
    <button type="button" class="switch-btn" id="switchModeBtn">Log In</button>
  </div>
</div>

<script>
let isLoginMode = false;

const elements = {
  form: document.getElementById('authForm'),
  title: document.getElementById('authTitle'),
  subtitle: document.getElementById('authSubtitle'),
  emailGroup: document.getElementById('emailGroup'),
  submitBtn: document.getElementById('submitBtn'),
  switchText: document.getElementById('switchText'),
  switchModeBtn: document.getElementById('switchModeBtn'),
  message: document.getElementById('message'),
  username: document.getElementById('username'),
  email: document.getElementById('email'),
  password: document.getElementById('password')
};

function showMessage(text, type = 'error') {
  elements.message.textContent = text;
  elements.message.className = type;
  elements.message.style.display = 'block';
}

function clearMessage() {
  elements.message.style.display = 'none';
}

function toggleMode() {
  isLoginMode = !isLoginMode;
  
  if (isLoginMode) {
    elements.title.textContent = 'Welcome Back';
    elements.subtitle.textContent = 'Sign in to your study log';
    elements.emailGroup.style.display = 'none';
    elements.submitBtn.textContent = 'Log In';
    elements.switchText.textContent = "Don't have an account?";
    elements.switchModeBtn.textContent = 'Sign Up';
  } else {
    elements.title.textContent = 'Welcome to Study Log';
    elements.subtitle.textContent = 'Create an account to start tracking your study sessions';
    elements.emailGroup.style.display = 'block';
    elements.submitBtn.textContent = 'Sign Up';
    elements.switchText.textContent = 'Already have an account?';
    elements.switchModeBtn.textContent = 'Log In';
  }
  
  clearMessage();
}

async function handleSubmit(e) {
  e.preventDefault();
  
  const username = elements.username.value.trim();
  const email = elements.email.value.trim();
  const password = elements.password.value;
  
  if (!username || !password) {
    showMessage('Please fill in all required fields');
    return;
  }
  
  if (password.length < 6) {
    showMessage('Password must be at least 6 characters long');
    return;
  }
  
  elements.submitBtn.disabled = true;
  clearMessage();
  
  try {
    const endpoint = isLoginMode ? '/api/login' : '/api/signup';
    const body = isLoginMode 
      ? { username, password }
      : { username, email, password };
    
    const response = await fetch(endpoint, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(body)
    });
    
    const data = await response.json();
    
    if (response.ok) {
      localStorage.setItem('study_app_token', data.token);
      showMessage(isLoginMode ? 'Welcome back!' : 'Account created successfully!', 'success');
      
      // Redirect to main app after a brief delay
      setTimeout(() => {
        window.location.href = '/';
      }, 1500);
    } else {
      showMessage(data.error || 'Something went wrong');
    }
  } catch (error) {
    showMessage('Network error. Please try again.');
  } finally {
    elements.submitBtn.disabled = false;
  }
}

// Event listeners
elements.form.addEventListener('submit', handleSubmit);
elements.switchModeBtn.addEventListener('click', toggleMode);

// Check if already logged in
const token = localStorage.getItem('study_app_token');
if (token) {
  // Already logged in, redirect to main app
  window.location.href = '/';
}
</script>

</body>
</html>
